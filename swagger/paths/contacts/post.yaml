tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a student with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: 'Contact name'
            type: string
            example: 'Kirk Pavlen'
          phoneNumber:
            description: 'The phone number of the contact'
            type: string
            example: '+380000000003'
          email:
            description: 'Contact email'
            type: string
            example: example@gmail.com
          isFavourite:
            description: 'Whether is contact favourite'
            type: boolean
            example: false
          contactType:
            description: 'The type of the contact'
            type: string
            example: 'personal'
            enum: ['personal', 'home', 'work']
          photo:
            description: 'Link to contact photo'
            type: string
            format: binary
responses:
  '201':
    description: 'Contact created'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully created a contact!'
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
